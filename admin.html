<style>
/* Ten.Ten 予約 デザインシステム「川の記録」（docs/DESIGN_DIRECTIONS.md 4章）。tools/sync_ui.js が各ページの UI:BEGIN〜END に写す。直接ページを直さない */
:root {
  --paper: #F6F3EC; --white: #FFFFFF; --ink: #1C2429; --ink-2: #3A444B; --mute: #5F666E; --hair: #D9D3C7; --hair-2: #EAE5DB;
  --river: #2F5D6B; --river-d: #244A56; --river-bg: #E9F0F1;
  --ember: #B4502F; --ember-d: #9A4225;
  --ok: #2E6B4A; --ok-bg: #E6F0E9; --warn: #8A5A00; --warn-bg: #FBF1D6; --bad: #A33A2C; --bad-bg: #F8E7E3;
  --sat: #2A62A8; --sun: #B23A2E;
  --r-s: 6px; --r-l: 12px;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  /* 旧い名前（第1・2回の画面が使う）。意味は上の色に寄せる */
  --navy: #1C2429; --navy-d: #0F1518; --brick: #B4502F; --brick-d: #9A4225; --teal: #2F5D6B; --teal-d: #244A56;
  --cream: #F6F3EC; --sub: #5F666E; --line: #D9D3C7; --flame: #D9A441; --ng: #A33A2C; --ng-bg: #F8E7E3; --warn-bg: #FBF1D6;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.7; font-feature-settings: "palt"; }
h1, h2, .serif { font-family: var(--serif); font-weight: 700; letter-spacing: .01em; line-height: 1.35; margin: 0; }
h1 { font-size: 30px; }
h2 { font-size: 22px; margin: 0 0 16px; }
h3 { font-family: var(--sans); font-weight: 700; font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 12px; }
a { color: var(--river); text-decoration-thickness: 1px; text-underline-offset: 3px; }
img { max-width: 100%; display: block; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 64px; }
.muted { color: var(--mute); font-size: 13.5px; line-height: 1.6; }
.small { font-size: 13px; }
.hidden { display: none !important; }
.center { text-align: center; }
.section { padding: 40px 0 0; }
.section > h2 { padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
@media (min-width: 720px) { h1 { font-size: 38px; } .section { padding-top: 56px; } }

/* 上部・下部 */
.site-header { background: var(--paper); border-bottom: 1px solid var(--hair); }
.site-header .in { max-width: 640px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.site-header a { color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; }
.site-header .logo { width: 40px; height: 32px; flex: none; background-size: contain; background-repeat: no-repeat; background-position: center; }
.site-header .name { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.1; letter-spacing: .02em; }
.site-header .name small { display: block; font-family: var(--sans); font-weight: 400; font-size: 11.5px; color: var(--mute); letter-spacing: .04em; margin-top: 3px; }
.test-banner { background: var(--warn-bg); color: var(--warn); font-size: 13px; text-align: center; padding: 6px 12px; }
.site-footer { margin-top: 56px; padding: 24px 20px 40px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--mute); }
.site-footer .in { max-width: 640px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.site-footer a { color: var(--mute); }
.site-footer .copy { width: 100%; margin-top: 8px; }

/* 部品 */
.card { background: var(--white); border: 1px solid var(--hair); border-radius: var(--r-l); padding: 20px; margin: 16px 0; }
.rule { border: 0; border-top: 1px solid var(--hair); margin: 24px 0; }
.btn { appearance: none; border: 1px solid transparent; border-radius: var(--r-s); background: var(--ember); color: #fff; font: inherit; font-weight: 700; font-size: 16px;
  padding: 0 20px; min-height: 52px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; line-height: 1.3; }
.btn:hover { background: var(--ember-d); }
.btn.block { display: flex; width: 100%; margin-top: 12px; }
.btn.navy, .btn.ink { background: var(--ink); }
.btn.navy:hover, .btn.ink:hover { background: #000; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { background: rgba(28,36,41,.05); }
.btn.small { font-size: 14px; min-height: 44px; padding: 0 16px; }
.btn[disabled], .btn.is-busy { opacity: .55; cursor: default; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
.link { background: none; border: 0; padding: 0; color: var(--river); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* 状態: 点＋文字（色だけで運ばない） */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.chip.ok::before { background: var(--ok); } .chip.ok { color: var(--ok); }
.chip.ng::before, .chip.full::before { background: var(--bad); } .chip.ng, .chip.full { color: var(--bad); }
.chip.wait::before { background: #D9A441; } .chip.wait { color: var(--warn); }
.chip.info::before { background: var(--river); } .chip.info { color: var(--river); }
.notice { border-radius: var(--r-s); padding: 12px 14px; margin: 12px 0; font-size: 14.5px; line-height: 1.6; border: 1px solid transparent; }
.notice.err { background: var(--bad-bg); color: var(--bad); border-color: #EBC8C0; }
.notice.ok { background: var(--ok-bg); color: var(--ok); border-color: #C5DACB; }
.notice.info { background: var(--river-bg); color: var(--river-d); border-color: #C9D9DD; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(28,36,41,.2); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { padding: 32px 0; text-align: center; color: var(--mute); font-size: 14px; }
dl.kv { display: grid; grid-template-columns: 6em 1fr; gap: 0 16px; margin: 0; }
dl.kv dt { color: var(--mute); font-size: 13.5px; padding: 9px 0; border-top: 1px solid var(--hair-2); }
dl.kv dd { margin: 0; padding: 9px 0; border-top: 1px solid var(--hair-2); overflow-wrap: anywhere; }
dl.kv dt:first-child, dl.kv dt:first-child + dd { border-top: 0; }
ul.list { padding-left: 1.2em; margin: 6px 0; }
ul.list li { margin: 4px 0; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.row-btns .btn { flex: 1 1 180px; }

/* 段階（細い線） */
.steps { display: flex; margin: 20px 0 0; padding: 0; list-style: none; gap: 6px; }
.steps li { flex: 1; font-size: 12px; color: var(--mute); padding-top: 8px; border-top: 2px solid var(--hair); }
.steps li.done { border-top-color: var(--river); color: var(--river); }
.steps li.now { border-top-color: var(--ink); color: var(--ink); font-weight: 700; }

/* 入力 */
.field { margin: 20px 0; }
.field label { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
.field .hint { font-size: 13px; color: var(--mute); margin-top: 6px; }
.field .ferr { font-size: 13.5px; color: var(--bad); margin-top: 6px; display: none; }
.field.bad .ferr { display: block; }
.field.bad input, .field.bad select, .field.bad textarea { border-color: var(--bad); }
.req { font-size: 12px; font-weight: 700; color: var(--ember); margin-left: 8px; }
.opt { font-size: 12px; font-weight: 400; color: var(--mute); margin-left: 8px; }
input[type=text], input[type=email], input[type=tel], input[type=date], input[type=time], input[type=number], input:not([type]), select, textarea {
  width: 100%; font: inherit; font-size: 16px; padding: 0 14px; height: 48px; border: 1px solid var(--hair); border-radius: var(--r-s); background: var(--white); color: var(--ink); }
input:focus, select:focus, textarea:focus { border-color: var(--river); outline: 2px solid var(--river); outline-offset: 0; }
textarea { height: auto; min-height: 88px; padding: 12px 14px; }
select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; cursor: pointer; font-weight: 400; }
.check input { width: 22px; height: 22px; flex: none; margin: 2px 0 0; accent-color: var(--ink); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

<script>
/* Ten.Ten 予約 共通の画面の道具（tools/sync_ui.js が各ページに写す。直接ページを直さない） */
var UI = {
  $: function (id) { return document.getElementById(id); },
  esc: function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  },
  yen: function (n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '円'; },
  /** google.script.run を Promise にする。通信の失敗も { ok:false } で返す */
  call: function (fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      google.script.run.withSuccessHandler(function (r) { resolve(r || { ok: false, message: '通信に失敗しました。' }); })
        .withFailureHandler(function () { resolve({ ok: false, message: '通信に失敗しました。電波の良い所で、もう一度お試しください。' }); })[fn].apply(null, args);
    });
  },
  loading: function (text) { return '<div class="loading"><span class="spinner" aria-hidden="true"></span>' + UI.esc(text || '読み込み中…') + '</div>'; },
  /** Google カレンダーに追加するリンク（日本時間） */
  calendarUrl: function (o) {
    var d = String(o.date).replace(/-/g, '');
    var t = function (hm) { return String(hm).replace(':', '') + '00'; };
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(o.title) +
      '&dates=' + d + 'T' + t(o.start) + '/' + d + 'T' + t(o.end) +
      '&ctz=Asia%2FTokyo' +
      '&location=' + encodeURIComponent(o.location || '') +
      '&details=' + encodeURIComponent(o.details || '');
  },
  /** 月のカレンダーのマス（日曜はじまり）。前の空きは date:null。m は 1〜12 */
  monthCells: function (y, m) {
    var first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var cells = [];
    for (var i = 0; i < first; i++) cells.push({ date: null });
    for (var d = 1; d <= days; d++) {
      cells.push({ date: y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d, day: d, dow: (first + d - 1) % 7 });
    }
    return cells;
  },
  /** 当日のご案内（場所・アクセス・持ち物）。罫線の表 */
  guideHtml: function (g, opt) {
    opt = opt || {};
    var e = UI.esc;
    return '<section class="guide"><h3>' + (opt.title || '当日のご案内') + '</h3>' +
      '<dl class="kv"><dt>場所</dt><dd>' + e(g.venue) + '</dd>' +
      '<dt>アクセス</dt><dd>' + g.access.map(e).join('<br>') + '</dd>' +
      '<dt>持ち物</dt><dd>' + g.bring.map(e).join('・') + '<div class="muted" style="margin-top:4px">' + g.notes.map(e).join('／') + '</div></dd></dl>' +
      '<a class="btn ghost small block" href="' + e(g.mapUrl) + '" target="_blank" rel="noopener">Google マップで開く</a>' +
      '</section>';
  },
  /** 予約1件の内容（予約確認ページ・メールでの確認ページで共通）。v は Access.view の形 */
  reservationHtml: function (v, g) {
    var e = UI.esc;
    var cls = { CONFIRMED: 'ok', CANCEL_REQUESTED: 'wait', NEEDS_ATTENTION: 'wait' }[v.status] || 'ng';
    var html = '<div class="rv-head"><span class="chip ' + cls + '">' + e(v.statusLabel) + '</span>' +
      (v.refundLabel ? '<span class="muted">' + e(v.refundLabel) + '</span>' : '') + '</div>' +
      '<div class="rv-no serif num">' + e(v.number) + '</div>' +
      '<dl class="kv">' +
      '<dt>日時</dt><dd>' + e(v.dateLabel) + ' ' + e(v.time) + '</dd>' +
      '<dt>内容</dt><dd>' + e(v.eventTitle) + '</dd>' +
      '<dt>場所</dt><dd>' + e(v.venue) + '</dd>' +
      '<dt>人数</dt><dd>' + e(v.partySize) + '名</dd>' +
      '<dt>お支払い</dt><dd>' + UI.yen(v.amount) + '<span class="muted">（1名 ' + UI.yen(v.unitPrice) + '）</span></dd>' +
      '<dt>代表者</dt><dd>' + e(v.name) + ' 様</dd>' +
      (v.emailMasked ? '<dt>メール</dt><dd>' + e(v.emailMasked) + '</dd>' : '') + '</dl>';
    if (v.upcoming && g) {
      html += '<div class="row-btns">' +
        '<a class="btn ink small" target="_blank" rel="noopener" href="' + e(UI.calendarUrl({
          date: v.date, start: v.start, end: v.end, title: 'テントサウナ Ten.Ten（' + v.number + '）', location: g.venue,
          details: '予約番号 ' + v.number + '\n持ち物: ' + g.bring.join('・') + '\n地図: ' + g.mapUrl })) + '">Google カレンダーに追加</a>' +
        '<a class="btn ghost small" href="' + e(g.mapUrl) + '" target="_blank" rel="noopener">地図を開く</a></div>';
    }
    return html;
  },
  /** キャンセル申請の確認（返金なしをはっきり伝えてから送る）。i は同じページの中で区別する番号 */
  cancelBoxHtml: function (i) {
    return '<p style="margin:20px 0 0"><button type="button" class="link" data-open="' + i + '">この予約のキャンセルを申請する</button></p>' +
      '<div id="cf' + i + '" class="hidden cancel-box"><div class="notice err"><b>キャンセルを申請しますか？</b><br>お客様のご都合によるキャンセルのため、<b>返金はありません</b>。主催者が確認した後に確定します。</div>' +
      '<div class="field"><label for="rs' + i + '">理由<span class="opt">任意</span></label><textarea id="rs' + i + '" maxlength="200"></textarea></div>' +
      '<div id="er' + i + '" class="notice err hidden" role="alert"></div>' +
      '<button type="button" class="btn block" style="background:var(--bad)" data-send="' + i + '">返金なしでキャンセルを申請する</button>' +
      '<button type="button" class="btn ghost block" data-close="' + i + '">やめる（予約はそのまま）</button></div>';
  },
  /** cancelBoxHtml のボタンを動かす。send(i, reason, showError) で申請する */
  bindCancel: function (root, send) {
    var q = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };
    q('[data-open]').forEach(function (b) {
      b.onclick = function () { var i = b.getAttribute('data-open'); UI.$('cf' + i).classList.remove('hidden'); b.classList.add('hidden'); };
    });
    q('[data-close]').forEach(function (b) {
      b.onclick = function () { var i = b.getAttribute('data-close'); UI.$('cf' + i).classList.add('hidden'); root.querySelector('[data-open="' + i + '"]').classList.remove('hidden'); };
    });
    q('[data-send]').forEach(function (b) {
      b.onclick = function () {
        var i = b.getAttribute('data-send');
        b.disabled = true;
        send(i, UI.$('rs' + i).value, function (msg) {
          b.disabled = false;
          UI.$('er' + i).textContent = msg;
          UI.$('er' + i).classList.remove('hidden');
        });
      };
    });
  },
  /** 上部（ロゴ）・テスト環境の帯・下部のリンクを、設定から組み立てる */
  chrome: function (cfg) {
    var e = UI.esc;
    var head = UI.$('siteHeaderLink');
    if (head && cfg.webAppUrl) head.href = cfg.webAppUrl;
    if (head && cfg.shopName) head.setAttribute('aria-label', cfg.shopName + '（予約ページのはじめへ）');
    var tb = UI.$('testBanner');
    if (tb) tb.classList.toggle('hidden', cfg.env !== 'test');
    var foot = UI.$('siteFooter');
    if (foot) {
      var links = [];
      if (cfg.termsUrl) links.push('<a href="' + e(cfg.termsUrl) + '" target="_blank" rel="noopener">ご利用規約</a>');
      if (cfg.privacyUrl) links.push('<a href="' + e(cfg.privacyUrl) + '" target="_blank" rel="noopener">個人情報の取り扱い</a>');
      if (cfg.lawUrl) links.push('<a href="' + e(cfg.lawUrl) + '" target="_blank" rel="noopener">特定商取引法に基づく表記</a>');
      if (cfg.guide && cfg.guide.instagram) links.push('<a href="' + e(cfg.guide.instagram) + '" target="_blank" rel="noopener">Instagram ' + e(cfg.guide.instagramName) + '</a>');
      foot.innerHTML = '<div class="in">' + links.join('') + '<div class="copy">© ' + e(cfg.shopName || 'Ten.Ten ｜大阪・能勢のテントサウナ') + '</div></div>';
    }
    if (cfg.shopName && !document.title) document.title = cfg.shopName; // 題名は doGet が付ける。開発用サーバーなど無いときだけ
  }
};
</script>
<!-- UI:END -->
<style>
  /* 管理画面だけの見た目。紙と墨はお客様の画面と同じ、密度は作業向け（docs/DESIGN_DIRECTIONS.md 4章）
     パソコン: 左に細いメニュー＋表／スマホ: 上は細い帯、下に親指で届くタブ（受付は屋外で片手） */
  body { font-size: 14.5px; line-height: 1.55; background: var(--paper); }
  h1 { font-size: 24px; }
  h2 { font-family: var(--sans); font-size: 15px; font-weight: 700; margin: 28px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); display: flex; align-items: baseline; gap: 8px; }
  h2 .muted { font-weight: 400; font-size: 13px; }
  .btn { font-size: 14.5px; min-height: 44px; padding: 0 16px; background: var(--ink); }
  .btn:hover { background: #000; }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: rgba(28,36,41,.05); }
  .btn.small { font-size: 13.5px; min-height: 40px; padding: 0 14px; }
  .btn.danger { background: var(--bad); }
  .btn.danger-ghost { background: transparent; color: var(--bad); border-color: var(--bad); }
  .btn.danger-ghost:hover { background: var(--bad-bg); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .btns .spacer { flex: 1; }
  .meta { color: var(--mute); font-size: 13px; }
  .meta a { color: var(--river); }
  .chip .k { font-weight: 400; color: var(--mute); }
  .row { display: flex; justify-content: space-between; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
  .field { margin: 14px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=time], input[type=number], input:not([type]), select, textarea { height: 44px; font-size: 15px; }

  /* 骨組み */
  .shell { display: block; }
  .side { display: none; }
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--hair); }
  .topbar .in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
  .brand .logo { width: 34px; height: 28px; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .brand b { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.1; display: block; }
  .brand small { display: block; font-size: 11px; color: var(--mute); }
  .who { font-size: 12px; text-align: right; color: var(--mute); line-height: 1.5; }
  .who a { color: var(--ink); }
  .role { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); }
  .role.staff { border-color: var(--hair); color: var(--mute); }
  .envbar { background: var(--warn-bg); color: var(--warn); font-size: 12.5px; padding: 6px 16px; text-align: center; }
  main { padding: 16px 16px 96px; max-width: 1120px; margin: 0 auto; }
  /* 下のタブ（スマホ） */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--white); border-top: 1px solid var(--hair); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { appearance: none; border: 0; border-top: 3px solid transparent; background: transparent; color: var(--mute); font: inherit; font-size: 13px; font-weight: 700; min-height: 54px; padding: 6px 2px 8px; position: relative; cursor: pointer; margin-top: -1px; }
  .tabbar button.on { color: var(--ink); border-top-color: var(--ink); }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--ember); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
  .tabbar .badge { position: absolute; top: 4px; left: calc(50% + 12px); }
  .side-nav { display: none; }
  @media (min-width: 900px) {
    .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
    .side { display: flex; flex-direction: column; border-right: 1px solid var(--hair); padding: 20px 16px; position: sticky; top: 0; height: 100vh; }
    .side .brand { margin-bottom: 28px; }
    .side-nav { display: block; }
    .side-nav button { appearance: none; border: 0; background: transparent; font: inherit; font-size: 14.5px; color: var(--ink-2); width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--r-s); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .side-nav button:hover { background: rgba(28,36,41,.05); }
    .side-nav button.on { background: var(--ink); color: #fff; font-weight: 700; }
    .side-nav button.on .badge { background: #fff; color: var(--ink); }
    .side .who { margin-top: auto; text-align: left; padding-top: 16px; border-top: 1px solid var(--hair); }
    .topbar { display: none; }
    .tabbar { display: none; }
    main { padding: 28px 32px 64px; }
    h1 { font-size: 26px; }
  }

  /* ホーム */
  .todo { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .todo b.n { font-family: var(--serif); font-size: 22px; color: var(--ember); margin-right: 8px; }
  .todo.info b.n { color: var(--ink); }
  .todo p { margin: 2px 0 0; font-size: 12.5px; color: var(--mute); }
  .todo .btn { flex: none; }
  .ev-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .ev-h .d { font-family: var(--serif); font-weight: 700; font-size: 18px; }
  .ev-h .t { font-weight: 700; font-size: 15px; }
  .evcard { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .evcard.today { border-left: 3px solid var(--ink); padding-left: 12px; }
  .seat { margin-top: 6px; }
  .bar { height: 4px; background: var(--hair-2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar span { display: block; height: 100%; background: var(--river); }
  .bar.full span { background: var(--bad); }
  .seat-t b { font-family: var(--serif); font-size: 17px; }
  @media (min-width: 900px) { .evgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; } }

  /* 面の中の確認（公開・複製・中止・入力） */
  .panel { background: var(--white); border: 1px solid var(--ink); border-radius: var(--r-l); padding: 16px; margin: 12px 0; }
  .panel.danger { border-color: var(--bad); }
  .panel h3 { font-family: var(--serif); font-size: 17px; margin: 0 0 10px; }
  .sum { display: grid; grid-template-columns: 6em 1fr; gap: 6px 12px; margin: 8px 0; font-size: 14px; }
  .sum dt { color: var(--mute); }
  .sum dd { margin: 0; font-weight: 700; }

  /* 予約の行 */
  .res { padding: 12px 0; border-bottom: 1px solid var(--hair); display: grid; gap: 4px; }
  .res .name { font-size: 16px; font-weight: 700; }
  .res .ppl { font-family: var(--serif); font-size: 16px; font-weight: 700; margin-left: 8px; }
  .res .st { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  @media (min-width: 900px) {
    .res { grid-template-columns: minmax(170px, 1.1fr) minmax(220px, 1.5fr) minmax(220px, 1.4fr); gap: 2px 20px; align-items: start; }
    .res .wide { grid-column: 1 / -1; }
  }
  .thead { display: none; }
  @media (min-width: 900px) { .thead { display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(220px, 1.5fr) minmax(220px, 1.4fr); gap: 0 20px; font-size: 12px; color: var(--mute); padding: 6px 0; border-bottom: 1px solid var(--ink); } }

  /* 受付 */
  .ci { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .ci .big { font-size: 18px; font-weight: 700; }
  .ci .btn { min-width: 120px; min-height: 52px; font-size: 16px; }
  .ci.done .big { color: var(--mute); }
  .ci-sum { font-family: var(--serif); font-size: 22px; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { border-bottom: 1px solid var(--hair); padding: 8px 6px 8px 0; text-align: left; vertical-align: top; }
  th { color: var(--mute); font-weight: 600; font-size: 12px; border-bottom-color: var(--ink); }
  .scroll { overflow-x: auto; }
  .scroll th, .scroll td { white-space: nowrap; }
  .login { max-width: 400px; margin: 40px auto; padding: 0 20px; }
  .toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); max-width: calc(100% - 32px); z-index: 50;
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: var(--r-s); font-weight: 700; font-size: 14px; }
  .toast.err { background: var(--bad); }
  @media (min-width: 900px) { .toast { bottom: 24px; } }
  .more-list button { appearance: none; border: 0; border-bottom: 1px solid var(--hair); background: transparent; width: 100%; text-align: left; font: inherit; font-size: 16px; padding: 16px 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--ink); }
</style>
</head>
<body>
<div id="loginView" class="login hidden">
  <p class="muted" style="letter-spacing:.1em;margin-top:8px">Ten.Ten ｜大阪・能勢のテントサウナ</p>
  <h1>予約管理 ログイン</h1>
  <p style="margin-top:12px">管理者として登録したメールアドレスに、ログイン用のリンクを送ります（15分以内・1回だけ有効）。</p>
  <div class="field"><label for="loginEmail">メールアドレス</label>
    <input id="loginEmail" type="email" autocomplete="email" inputmode="email"></div>
  <button type="button" class="btn block" id="loginBtn">ログインのリンクを送る</button>
  <div id="loginMsg"></div>
</div>

<div id="appView" class="hidden">
  <div class="shell">
    <aside class="side">
      <a class="brand" id="brandLink" href="#"><span class="logo" aria-hidden="true"></span><span><b>予約管理</b><small>Ten.Ten ｜大阪・能勢</small></span></a>
      <nav class="side-nav" id="nav" aria-label="管理画面のメニュー"></nav>
      <div class="who"><span id="who"></span><br><span id="role" class="role"></span><br>
        <a href="#" id="toBooking" target="_blank" rel="noopener" class="hidden">予約画面を見る</a><span id="sep" class="hidden"> ・ </span><a href="#" id="logout">ログアウト</a></div>
    </aside>
    <div>
      <header class="topbar"><div class="in">
        <span class="brand"><span class="logo" aria-hidden="true"></span><span><b>予約管理</b></span></span>
        <div class="who"><span id="who2"></span> <span id="role2" class="role"></span></div>
      </div></header>
      <div id="envBar" class="envbar hidden"></div>
      <main id="main"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="管理画面のメニュー（スマホ）"></nav>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
  var S = { token: '', me: null, tab: 'home', events: [], dash: null };
  var esc = UI.esc, yen = UI.yen, $ = UI.$;
  var TABS = [
    ['home', 'ホーム'], ['events', '開催回'], ['res', '予約'], ['checkin', '受付'], ['requests', '申請'],
    ['refunds', '返金', 'MASTER'], ['issues', '要対応'], ['admins', '管理者', 'MASTER']
  ];
  var MOBILE_TABS = ['home', 'checkin', 'res', 'requests', 'more']; // 下のタブ。残りは「その他」
  // 状態の名前（予約・支払い・返金を混同しないように、表示では「予約:」「支払い:」「返金:」を付ける）
  var RS_L = { HOLD: '決済待ち', CONFIRMED: '確定', CANCEL_REQUESTED: 'キャンセル申請中', CANCELLED: 'キャンセル済（返金なし）', EXPIRED: '期限切れ（未確定）',
    EVENT_CANCELLED: '開催中止', NEEDS_ATTENTION: '要確認' };
  var PS_L = { PENDING: '決済中', PAID: '支払済', EXPIRED: '期限切れ', FAILED: '失敗', REFUNDED: '返金済' };
  var RF_L = { TO_REFUND: '返金待ち', PROCESSING: '手続き中', PENDING: '手続き中', SUCCEEDED: '返金済', FAILED: '返金失敗' };
  var EV_L = { DRAFT: '未公開', PUBLISHED: '公開中', CANCELLED: '開催中止' };
  function st(kind, v) {
    if (!v) return '';
    var label = (kind === '予約' ? RS_L : kind === '支払い' ? PS_L : RF_L)[v] || v;
    var cls = /^(CONFIRMED|PAID|SUCCEEDED)$/.test(v) ? 'ok' : /^(FAILED|NEEDS_ATTENTION|EVENT_CANCELLED|CANCELLED|EXPIRED)$/.test(v) ? 'ng' : 'wait';
    return '<span class="chip ' + cls + '"><span class="k">' + kind + '</span>' + esc(label) + '</span>';
  }
  function evChip(s) { return '<span class="chip ' + (s === 'PUBLISHED' ? 'ok' : s === 'CANCELLED' ? 'ng' : 'info') + '">' + esc(EV_L[s] || s) + '</span>'; }
  function todayJst() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' }); }
  function jst(iso) { var d = new Date(new Date(iso).getTime() + 9 * 3600000); return isNaN(d) ? '' : d.toISOString().slice(0, 16).replace('T', ' '); }
  function dowLabel(date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return '';
    var p = date.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return Number(p[1]) + '月' + Number(p[2]) + '日(' + '日月火水木金土'.charAt(d.getDay()) + ')';
  }
  function eventLine(e) { return esc(e.dateLabel) + ' ' + esc(e.start_time) + '〜' + esc(e.end_time) + '　' + esc(e.title); }
  function each(root, attr, fn) {
    Array.prototype.forEach.call(root.querySelectorAll('[' + attr + ']'), function (b) { b.onclick = function (ev) { ev.preventDefault(); fn(b.getAttribute(attr), b); }; });
  }

  /** 画面の下に短く出すお知らせ（alert の代わり。画面は止めない） */
  var toastTimer = null;
  function toast(text, isErr) {
    var t = $('toast');
    t.textContent = text; t.className = 'toast' + (isErr ? ' err' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = 'toast hidden'; }, isErr ? 6000 : 3500);
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      google.script.run.withSuccessHandler(function (res) {
        res = res || { ok: false, message: '通信に失敗しました' };
        if (!res.ok && res.code === 'AUTH') logoutLocal(res.message);
        if (!res.ok && res.code === 'FORBIDDEN') res.message += '（主管理者に依頼してください）';
        resolve(res);
      }).withFailureHandler(function () { resolve({ ok: false, message: '通信に失敗しました。電波の良い所で、もう一度お試しください。' }); })[fn].apply(null, args);
    });
  }
  function admin(fn) { var a = Array.prototype.slice.call(arguments, 1); return call.apply(null, [fn, S.token].concat(a)); }
  function notice(res, okText) {
    return res.ok ? (okText ? '<div class="notice ok">' + esc(okText) + '</div>' : '') : '<div class="notice err" role="alert">' + esc(res.message) + '</div>';
  }
  function busy(b, text) { b.disabled = true; b.dataset.label = b.textContent; b.textContent = text || '処理しています…'; }
  function unbusy(b) { b.disabled = false; if (b.dataset.label) b.textContent = b.dataset.label; }
  function isMaster() { return S.me && S.me.role === 'MASTER'; }
  function store(t) { try { if (t) sessionStorage.setItem('adm', t); else sessionStorage.removeItem('adm'); } catch (e) {} }
  function logoutLocal(why) {
    S.token = ''; store('');
    $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
    if (why) $('loginMsg').innerHTML = '<div class="notice err">' + esc(why) + '</div>';
  }

  /* ---------- ログイン ---------- */
  $('loginBtn').onclick = function () {
    var b = $('loginBtn'); busy(b, '送っています…');
    call('api_adminRequestLogin', $('loginEmail').value).then(function (res) {
      unbusy(b);
      $('loginMsg').innerHTML = notice(res, res.ok ? res.data.message : '');
    });
  };
  $('logout').onclick = function (e) { e.preventDefault(); admin('api_adminLogout').then(function () { logoutLocal(); }); };
  $('brandLink').onclick = function (e) { e.preventDefault(); go('home'); };

  function start() {
    admin('api_adminMe').then(function (res) {
      if (!res.ok) { logoutLocal(res.message); return; }
      S.me = res.data;
      $('who').textContent = S.me.email; $('who2').textContent = S.me.email;
      var r = isMaster() ? '主管理者' : '一般管理者', rc = 'role' + (isMaster() ? '' : ' staff');
      $('role').textContent = r; $('role').className = rc; $('role2').textContent = r; $('role2').className = rc;
      $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
      go('home');
    });
    // お客様の見る予約画面へのリンク（公開の設定だけを使う）
    call('api_getPublicConfig').then(function (c) {
      if (c && c.ok && /^https:\/\//.test(c.data.webAppUrl)) {
        $('toBooking').href = c.data.webAppUrl; $('toBooking').classList.remove('hidden'); $('sep').classList.remove('hidden');
      }
    });
  }
  var counts = {};
  function visibleTabs() { return TABS.filter(function (t) { return !t[2] || (S.me && S.me.role === t[2]); }); }
  function nav() {
    var badge = function (n) { return n ? '<span class="badge" aria-label="' + n + '件">' + n + '</span>' : ''; };
    $('nav').innerHTML = visibleTabs().map(function (t) {
      return '<button type="button" data-t="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '><span>' + t[1] + '</span>' + badge(counts[t[0]]) + '</button>';
    }).join('');
    each($('nav'), 'data-t', function (t) { go(t); });
    // スマホの下のタブ: 5つ。「その他」には残りのメニューと、その件数の合計
    var names = {}; TABS.forEach(function (t) { names[t[0]] = t[1]; }); names.more = 'その他';
    var inBar = {}; MOBILE_TABS.forEach(function (k) { inBar[k] = true; });
    var moreCount = visibleTabs().reduce(function (n, t) { return n + (inBar[t[0]] ? 0 : (counts[t[0]] || 0)); }, 0);
    $('tabbar').innerHTML = MOBILE_TABS.map(function (k) {
      var on = S.tab === k || (k === 'more' && !inBar[S.tab]);
      return '<button type="button" data-t="' + k + '" class="' + (on ? 'on' : '') + '"' + (on ? ' aria-current="page"' : '') + '>' + names[k] + badge(k === 'more' ? moreCount : counts[k]) + '</button>';
    }).join('');
    each($('tabbar'), 'data-t', function (t) { go(t); });
  }
  function setCounts(d) {
    S.dash = d;
    counts = { requests: d.cancelRequests, refunds: d.refundIssues, issues: d.attention + d.mailFailures + d.errors + (isMaster() ? 0 : d.refundIssues) };
    nav();
    var test = d.env !== 'prod' || d.stripeMode !== 'live';
    var bar = $('envBar');
    bar.classList.toggle('hidden', !test && d.mailMode === 'live');
    var mail = { dryrun: '送らない（記録だけ）', redirect: '自分のアドレスへ転送', live: '実際に送る' }[d.mailMode] || d.mailMode;
    bar.textContent = test ? 'テスト環境のデータです（本物の予約・お金ではありません）。お客様へのメール: ' + mail : '本番環境です。お客様へのメール: ' + mail;
  }
  function refreshCounts() { admin('api_adminDashboard').then(function (r) { if (r.ok) setCounts(r.data); }); }
  function go(tab, arg) {
    if (!S.me) return;
    S.tab = tab; nav();
    if (tab !== 'home') refreshCounts();
    $('main').innerHTML = UI.loading();
    ({ home: home, events: eventsTab, res: resTab, checkin: checkinTab, requests: requestsTab, refunds: refundsTab, issues: issuesTab, admins: adminsTab, more: moreTab })[tab](arg);
    window.scrollTo(0, 0);
  }
  /** スマホの「その他」: 下のタブに無いメニューの一覧 */
  function moreTab() {
    var inBar = {}; MOBILE_TABS.forEach(function (k) { inBar[k] = true; });
    $('main').innerHTML = '<h1>その他</h1><div class="more-list">' + visibleTabs().filter(function (t) { return !inBar[t[0]]; }).map(function (t) {
      return '<button type="button" data-t="' + t[0] + '"><span>' + t[1] + '</span>' + (counts[t[0]] ? '<span class="badge">' + counts[t[0]] + '</span>' : '<span class="meta">›</span>') + '</button>';
    }).join('') + '</div>' +
      '<p class="meta" style="margin-top:20px">' + esc(S.me.email) + '（' + (isMaster() ? '主管理者' : '一般管理者') + '）　<a href="#" id="logout2">ログアウト</a>' +
      ($('toBooking').classList.contains('hidden') ? '' : '　<a href="' + esc($('toBooking').href) + '" target="_blank" rel="noopener">予約画面を見る</a>') + '</p>';
    each($('main'), 'data-t', function (t) { go(t); });
    $('logout2').onclick = function (e) { e.preventDefault(); $('logout').onclick(e); };
  }
  function loadEvents(includePast) {
    return admin('api_adminListEvents', !!includePast).then(function (res) { if (res.ok) S.events = res.data; return res; });
  }
  function eventSelect(id, list, selected) {
    var today = todayJst();
    return '<select id="' + id + '">' + list.map(function (e) {
      return '<option value="' + esc(e.id) + '"' + (e.id === selected ? ' selected' : '') + '>' + (e.date === today ? '【今日】' : '') + eventLine(e) +
        (e.status !== 'PUBLISHED' ? '（' + esc(EV_L[e.status] || e.status) + '）' : '') + '</option>';
    }).join('') + '</select>';
  }

  /** 席の表示（予約＝確定とキャンセル申請中の人数。決済中は30分ほどで確定か解除） */
  function seatHtml(e, withCheckin) {
    var used = e.confirmedSeats + e.heldSeats, pct = e.capacity ? Math.min(100, Math.round(used / e.capacity * 100)) : 0;
    var full = e.remaining <= 0;
    return '<div class="seat"><div class="seat-t num">予約 <b>' + e.confirmedSeats + '</b> / 定員 ' + e.capacity + '名　残り <b>' + e.remaining + '</b>名' +
      (full ? '　<span class="chip full">満席</span>' : '') + '</div>' +
      '<div class="bar' + (full ? ' full' : '') + '" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      (e.heldSeats ? '<div class="meta">ほかに決済中 ' + e.heldSeats + '名（30分ほどで確定か解除）</div>' : '') +
      (withCheckin ? '<div class="meta">受付済 ' + e.checkedSeats + ' / ' + e.confirmedSeats + '名・' + e.groups + '組</div>' : '') + '</div>';
  }

  /* ---------- ホーム: 対応が必要なこと → 今日 → これから ---------- */
  function home() {
    admin('api_adminDashboard').then(function (res) {
      if (!res.ok) { $('main').innerHTML = notice(res); return; }
      var d = res.data, today = d.now.slice(0, 10);
      setCounts(d);
      var todo = [];
      var item = function (n, title, text, tab, btn, info) {
        if (n) todo.push('<div class="todo' + (info ? ' info' : '') + '"><div><b class="n num">' + n + '</b><b>' + esc(title) + '</b><p>' + esc(text) + '</p></div>' +
          '<button type="button" class="btn ' + (info ? 'ghost' : '') + ' small" data-t="' + tab + '">' + esc(btn) + '</button></div>');
      };
      item(d.cancelRequests, 'キャンセル申請', '「承認（返金なし・席が空く）」か「却下（予約はそのまま）」を選んでください。', 'requests', '申請を見る');
      item(d.refundIssues, '返金が終わっていない予約', isMaster() ? '中止した回の返金待ち・手続き中・失敗。内容を確認してから返金します。' : '主管理者が「返金」から対応します。', isMaster() ? 'refunds' : 'issues', isMaster() ? '返金を見る' : '内容を見る');

        '<div id="evForm"></div><div id="evMsg"></div>' +
        (S.events.length ? S.events.map(function (e) {
          return '<div class="evcard" id="ev-' + esc(e.id) + '"><div class="ev-h"><span class="d">' + esc(e.dateLabel) + '</span><span class="t num">' + esc(e.start_time) + '〜' + esc(e.end_time) + '</span>' + evChip(e.status) + '</div>' +
            '<div class="meta">' + esc(e.title) + '・1人あたり ' + yen(e.price) + '（入場料込み）' + (e.description ? '・補足: ' + esc(e.description) : '') + '</div>' +
            (e.status !== 'CANCELLED' ? seatHtml(e, false) : '<div class="meta">中止の理由: ' + esc(e.cancelReason) + (e.toRefund ? '・<b>返金待ち ' + e.toRefund + '件</b>' : '') + '</div>') +
            (master ? '<div class="btns">' +
              (e.status === 'DRAFT' ? '<button type="button" class="btn small" data-pub="' + esc(e.id) + '">内容を確認して公開</button>' : '') +
              (e.status === 'PUBLISHED' ? '<button type="button" class="btn ghost small" data-unpub="' + esc(e.id) + '">非公開にする</button>' : '') +

        }).join('') : '<p class="meta">開催回はまだありません</p>');
      $('past').onchange = function () { eventsTab($('past').checked); };
      if ($('newEv')) $('newEv').onclick = function () { eventForm(null, $('evForm')); };
      var find = function (id) { return S.events.filter(function (e) { return e.id === id; })[0]; };
      each($('main'), 'data-edit', function (id) { eventForm(find(id), $('pn-' + id)); });
      each($('main'), 'data-pub', function (id) { publishPanel(find(id), includePast); });
      each($('main'), 'data-unpub', function (id, b) {
        if (!confirm('非公開にすると、新しい予約を受け付けなくなります（すでにある予約はそのままです）。')) return;
        busy(b); admin('api_adminSetEventPublished', id, false).then(function (r) { if (r.ok) { toast('非公開にしました'); eventsTab(includePast); } else { unbusy(b); toast(r.message, true); } });
      });
      each($('main'), 'data-dup', function (id) { dupPanel(find(id), includePast); });
      each($('main'), 'data-cancel', function (id) { cancelPanel(find(id)); });
      each($('main'), 'data-refund', function (id) { go('refunds', id); });
    });
  }
  function closePanels() { Array.prototype.forEach.call(document.querySelectorAll('[id^="pn-"]'), function (p) { p.innerHTML = ''; }); $('evForm').innerHTML = ''; }
  function sumHtml(v) {

  /** 開催中止: 対象と、お客様に届くことを確かめてから。返金は次の画面で別に確認する */

  /** 開催回の入力（画面の確認は補助。正しいかどうかの最終の確認はサーバー） */

  var THEAD = '<div class="thead"><span>お名前・人数・予約番号</span><span>状態・回・金額</span><span>連絡先</span></div>';

  /* ---------- 受付（当日・スマホで使う） ---------- */
  function checkinTab(eventId) {
    loadEvents(false).then(function () {
      var live = S.events.filter(function (e) { return e.status !== 'CANCELLED'; });
      var today = todayJst();
      var sel = eventId || (live.filter(function (e) { return e.date === today; })[0] || live[0] || {}).id;
      if (!sel) { $('main').innerHTML = '<h1>受付</h1><p class="meta">受付する開催回がありません</p>'; return; }
      $('main').innerHTML = '<h1>受付</h1><div class="field"><label for="ciEv">開催回</label>' + eventSelect('ciEv', live, sel) + '</div>' +
        '<div id="ciDay"></div><div class="row" style="padding:8px 0 12px;border-bottom:1px solid var(--ink)"><div><div class="ci-sum num" id="ciSum" aria-live="polite"></div><div class="meta" id="ciSub"></div></div>' +
        '<button type="button" class="btn ghost small" id="ciReload">最新にする</button></div>' +
        '<div class="field"><label for="ciQ">名前・予約番号で探す</label><input id="ciQ" placeholder="例: 山田" autocomplete="off"></div><div id="ciList"></div>';
      var ev = function () { return live.filter(function (e) { return e.id === $('ciEv').value; })[0]; };
      var load = function (keepScroll) {
        var y = window.scrollY;
        var e = ev();
        $('ciDay').innerHTML = e && e.date !== today ? '<div class="notice info">今日の回ではありません（' + esc(e.dateLabel) + '）。</div>' : '';
        admin('api_adminListReservations', $('ciEv').value).then(function (res) {
          if (!res.ok) { $('ciList').innerHTML = notice(res); return; }
          var rows = res.data.filter(function (r) { return r.status === 'CONFIRMED' || r.status === 'CANCEL_REQUESTED'; })
            .sort(function (a, b) { return a.name.localeCompare(b.name, 'ja'); });
          var total = 0, done = 0, groups = 0;
          rows.forEach(function (r) { total += Number(r.party_size); if (r.checked_in) { done += Number(r.party_size); groups++; } });
          $('ciSum').textContent = '受付済 ' + done + ' / ' + total + '名';
          $('ciSub').textContent = rows.length + '組中 ' + groups + '組が受付済・未受付 ' + (total - done) + '名';
          $('ciList').innerHTML = rows.map(function (r) {
            var tel = String(r.phone || '').replace(/[^\d+]/g, '');
            return '<div class="ci' + (r.checked_in ? ' done' : '') + '" data-name="' + esc((r.name + ' ' + r.number).toLowerCase().replace(/\s+/g, '')) + '">' +
              '<div><div class="big">' + esc(r.name) + '　<span class="num">' + esc(r.party_size) + '名</span></div>' +
              '<div><span class="chip ' + (r.checked_in ? 'ok">受付済' : 'wait">未受付') + '</span>' + (r.status === 'CANCEL_REQUESTED' ? ' <span class="chip wait">キャンセル申請中</span>' : '') + '</div>' +
              '<div class="meta num">' + esc(r.number) + '・' + (tel ? '<a href="tel:' + esc(tel) + '">' + esc(r.phone) + '</a>' : esc(r.phone)) + '</div></div>' +
              (r.checked_in ? '<button type="button" class="btn ghost small" data-undo="' + esc(r.id) + '" aria-label="' + esc(r.name) + ' 様の受付を取り消す">取り消す</button>'
                : '<button type="button" class="btn" data-ci="' + esc(r.id) + '" data-who="' + esc(r.name + ' 様（' + r.party_size + '名）') + '">受付する</button>') + '</div>';
          }).join('') || '<p class="meta">確定した予約はありません</p>';
          filter();
          if (keepScroll) window.scrollTo(0, y);
          var act = function (id, b, on) {
            busy(b, on ? '受付中…' : '取り消し中…');
            admin('api_adminCheckin', id, on).then(function (r) {
              if (!r.ok) { unbusy(b); toast(r.message, true); return; }
              toast(on ? (b.getAttribute('data-who') || '') + ' を受付しました' : '受付を取り消しました');
              load(true);
            });
          };
          each($('ciList'), 'data-ci', function (id, b) { act(id, b, true); });
          each($('ciList'), 'data-undo', function (id, b) { if (confirm('受付を取り消しますか？')) act(id, b, false); });
        });
      };
      var filter = function () {
        var q = $('ciQ').value.toLowerCase().replace(/\s+/g, '');
        Array.prototype.forEach.call($('ciList').querySelectorAll('.ci'), function (c) { c.classList.toggle('hidden', !!q && c.getAttribute('data-name').indexOf(q) < 0); });
      };
      $('ciQ').oninput = filter;
      $('ciEv').onchange = function () { $('ciQ').value = ''; load(false); };
      $('ciReload').onclick = function () { load(true); toast('最新の状態にしました'); };
      load(false);
    });
  }

  /* ---------- 返金（主管理者） ---------- */
  function refundsTab(eventId) {
    if (!isMaster()) { $('main').innerHTML = '<h1>全額返金</h1><div class="notice info">返金は主管理者だけが実行できます。</div>'; return; }
    loadEvents(true).then(function () {
      var cancelled = S.events.filter(function (e) { return e.status === 'CANCELLED'; }).reverse();
      admin('api_adminIssues').then(function (iss) {
        var attention = iss.ok ? iss.data.attention.filter(function (r) { return r.payment_status === 'PAID'; }) : [];
        var opts = cancelled.map(function (e) { return '<option value="E:' + esc(e.id) + '"' + (e.id === eventId ? ' selected' : '') + '>中止: ' + eventLine(e) + '（返金待ち ' + e.toRefund + '件）</option>'; })
          .concat(attention.map(function (r) { return '<option value="R:' + esc(r.id) + '">要確認: ' + esc(r.number) + ' ' + esc(r.name) + '</option>'; }));
        $('main').innerHTML = '<h1>全額返金</h1><div class="notice info">開催中止にした回（または支払いの要確認の予約）だけが対象です。<b>「返金内容を確認」ではまだお金は動きません。</b>確認した内容で「返金する」と入力してから実行します。返金済みの予約は対象から外れるので、二重には返金されません。</div>' +
          (opts.length ? '<div class="field"><label for="rfT">対象</label><select id="rfT">' + opts.join('') + '</select></div><button type="button" class="btn" id="rfPrev">返金内容を確認</button>' : '<p class="meta">返金の対象はありません</p>') +
          '<div id="rfBox"></div>';
        if (!opts.length) return;
        $('rfPrev').onclick = preview;
        $('rfT').onchange = function () { $('rfBox').innerHTML = ''; };
      });
    });
    function target() { var v = $('rfT').value; return v.charAt(0) === 'E' ? { eventId: v.slice(2) } : { reservationId: v.slice(2) }; }
    function preview() {
      $('rfBox').innerHTML = UI.loading('返金の対象を確認しています…');
      admin('api_adminRefundPreview', target()).then(function (res) {
        if (!res.ok) { $('rfBox').innerHTML = notice(res); return; }
        var p = res.data;
        $('rfBox').innerHTML = '<div class="panel danger"><h3>返金の内容</h3>' +
          (p.alreadyRefunded ? '<p class="meta">返金済み ' + p.alreadyRefunded + '件（今回の対象外）</p>' : '') +
          (p.inProgress ? '<p class="meta">手続き中 ' + p.inProgress + '件（結果待ち・今回の対象外。10分ごとに確認されます）</p>' : '') +
          (p.count ? '<div class="scroll"><table><tr><th>予約番号</th><th>代表者</th><th>人数</th><th>返金額</th><th>状態</th></tr>' +
            p.items.map(function (r) { return '<tr><td class="num">' + esc(r.number) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.party_size) + '名</td><td class="num">' + yen(r.amount) + '</td><td>' + st('返金', r.refund_status) + (r.refund_error ? '<br><span class="meta">' + esc(r.refund_error) + '</span>' : '') + '</td></tr>'; }).join('') +
            '</table></div><dl class="sum"><dt>対象</dt><dd>' + p.count + '件・' + p.totalPeople + '名</dd><dt>返金の合計</dt><dd class="serif num" style="font-size:22px">' + yen(p.totalAmount) + '</dd></dl>' +
            '<div class="field"><label for="rfWord">実行するには「返金する」と入力してください</label><input id="rfWord" autocomplete="off"></div>' +
            '<button type="button" class="btn danger block" id="rfExec">' + p.count + '件・' + yen(p.totalAmount) + 'を返金する</button>'
            : '<p>返金する予約はありません。</p>') + '<div id="rfRes"></div></div>';
        $('rfBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (!p.count) return;
        $('rfExec').onclick = function () {
          if ($('rfWord').value.trim() !== '返金する') { $('rfRes').innerHTML = '<div class="notice err">「返金する」と入力してください。</div>'; $('rfWord').focus(); return; }
          busy($('rfExec'), '返金しています…（画面を閉じないでください）');
          admin('api_adminRefundExecute', target(), p.hash).then(function (r) {
            if (!r.ok) { $('rfRes').innerHTML = notice(r); $('rfExec').textContent = 'やり直すには「返金内容を確認」から'; return; }

              (d.failed.length ? '<br>失敗 ' + d.failed.length + '件: ' + esc(d.failed.join(', ')) + '<br>「返金内容を確認」から、失敗した分だけを再実行できます' : '') +
              (d.skipped.length ? '<br>時間切れで未処理 ' + d.skipped.length + '件（「返金内容を確認」から再実行してください）' : '') + '</div>';
            $('rfExec').textContent = '完了（もう一度確認するには「返金内容を確認」）';
            refreshCounts();
          });
        };
      });
    }

  /* ---------- 要対応 ---------- */
  function issuesTab() {
    admin('api_adminIssues').then(function (res) {
      if (!res.ok) { $('main').innerHTML = notice(res); return; }
      var d = res.data;
      var sec = function (title, n, text, body) { return '<h2>' + title + ' <span class="muted">' + n + '件</span></h2>' + (n ? '<p class="meta">' + text + '</p>' + body : '<p class="meta">✓ ありません</p>'); };
      // 「確認済み」より前の記録は薄く表示し「確認済み」と書く（記録は消さない）
      var ackAt = (d.ack && d.ack.at) || '';
      var seen = function (at) { return ackAt && at <= ackAt; };
      var newCount = d.mailFailures.filter(function (m) { return !seen(m.at); }).length + d.errors.filter(function (x) { return !seen(x.at); }).length;
      var ackBox = '<div class="panel" style="margin-top:28px"><h3>メールの送信失敗・処理エラー</h3>' +
        '<p class="meta" style="margin:0 0 8px">記録なので、対応しても自動では消えません。ホームの件数は直近7日間で、<b>「確認済み」より後の物だけ</b>を数えます。記録そのものは下の表に残ります。</p>' +
        (ackAt ? '<p class="meta" style="margin:0 0 8px">前回の確認済み: ' + esc(jst(ackAt)) + '（' + esc(d.ack.by) + '）</p>' : '') +
        (isMaster() ? (newCount ? '<button type="button" class="btn small" id="ackBtn">ここまでを確認済みにする（' + newCount + '件）</button>' : '<p class="meta" style="margin:0">✓ 未確認の記録はありません</p>')
          : '<p class="meta" style="margin:0">「確認済み」にできるのは主管理者です。</p>') + '</div>';
      var mark = function (at) { return seen(at) ? ' style="color:var(--mute)"' : ''; };
      var seenTag = function (at) { return seen(at) ? '<br><span class="chip">確認済み</span>' : ''; };
      $('main').innerHTML = '<h1>要対応</h1>' +
        sec('支払いの要確認', d.attention.length, '支払い済みですが自動で確定できなかった予約です。お客様に連絡し、必要なら主管理者が「返金」から返金します。', d.attention.map(function (r) { return resRow(r); }).join('')) +
        sec('返金が終わっていない予約', d.refunds.length, '返金待ち・手続き中・失敗。' + (isMaster() ? '「返金」から確認して実行します。' : '主管理者が対応します。'), d.refunds.map(function (r) { return resRow(r); }).join('')) +
        sec('メールが届いたか分からない予約', d.stuckMails.length, '送信中に処理が止まりました。お客様に確認するか、確認メールを再送してください。', d.stuckMails.map(function (r) { return resRow(r, '<button type="button" class="link" data-resend="' + esc(r.id) + '" style="font-size:13px">確認メールを再送</button>'); }).join('')) +
        ackBox +
        sec('メールの送信失敗', d.mailFailures.length, '新しい順・最大50件。', '<div class="scroll"><table><tr><th>日時</th><th>予約番号</th><th>種類</th><th>宛先</th><th>理由</th><th></th></tr>' +
          d.mailFailures.map(function (m) {
            return '<tr' + mark(m.at) + '><td class="num">' + esc(jst(m.at)) + seenTag(m.at) + '</td><td class="num">' + esc(m.number) + '</td><td>' + esc(m.kind) + '</td><td>' + esc(m.to_masked) + '</td><td>' + esc(m.error) + '</td><td>' +
              (m.kind === 'confirmation' && m.reservation_id ? '<button type="button" class="btn ghost small" data-resend="' + esc(m.reservation_id) + '">再送</button>' : '') + '</td></tr>';
          }).join('') + '</table></div>') +
        sec('処理エラー', d.errors.length, '新しい順・最大50件。', '<div class="scroll"><table><tr><th>日時</th><th>場所</th><th>内容</th><th>対象</th></tr>' +
          d.errors.map(function (x) { return '<tr' + mark(x.at) + '><td class="num">' + esc(jst(x.at)) + seenTag(x.at) + '</td><td>' + esc(x.where) + '</td><td>' + esc(x.code) + '<br><span class="meta">' + esc(x.message) + '</span></td><td>' + esc(x.ref) + '</td></tr>'; }).join('') + '</table></div>');
      bindResend($('main'));
      if ($('ackBtn')) $('ackBtn').onclick = function () {
        if (!confirm('今までのメール送信失敗・処理エラーを「確認済み」にします。\nホームの件数から外れます（記録は消えません）。\n「支払いの要確認」「返金」は対象外です。')) return;
        busy($('ackBtn'));
        admin('api_adminAckIssues').then(function (r) {
          if (!r.ok) { unbusy($('ackBtn')); toast(r.message, true); return; }
          toast('確認済みにしました'); refreshCounts(); issuesTab();
        });
      };
    });

      admin('api_adminAuditLog').then(function (a) {
        if (!a.ok) return;
        $('audit').innerHTML = '<table><tr><th>日時</th><th>操作した人</th><th>操作</th><th>対象</th><th>結果</th></tr>' + a.data.slice(0, 100).map(function (x) {
          return '<tr><td class="num">' + esc(jst(x.at)) + '</td><td>' + esc(x.actor) + '</td><td>' + esc(x.action) + '</td><td>' + esc(x.target) + '</td><td>' + esc(x.result) + '</td></tr>';
        }).join('') + '</table>';
      });
    });
  }

  /* ---------- 起動 ---------- */
  google.script.url.getLocation(function (loc) {
    var p = loc.parameter || {};
    var saved = '';
    try { saved = sessionStorage.getItem('adm') || ''; } catch (e) { saved = ''; }
    if (p.login) {
      // 新しいログインのリンクを優先する。使用済み（再読み込み）なら、保存してあるログインで続ける
      call('api_adminExchangeLogin', p.login).then(function (res) {
        if (res.ok) { S.token = res.data.token; store(S.token); start(); return; }
        if (saved) { S.token = saved; start(); return; }
        $('loginView').classList.remove('hidden'); $('loginMsg').innerHTML = notice(res);
      });
      return;
    }
    S.token = saved;
    if (S.token) start(); else $('loginView').classList.remove('hidden');
  });
</script>
</body>
</html>
